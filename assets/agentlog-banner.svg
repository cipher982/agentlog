<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="agentlog">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#070A12" />
    </linearGradient>

    <radialGradient id="glow" cx="18%" cy="35%" r="60%">
      <stop offset="0" stop-color="#00D1FF" stop-opacity="0.35" />
      <stop offset="0.55" stop-color="#8B5CF6" stop-opacity="0.18" />
      <stop offset="1" stop-color="#0B1220" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00D1FF" />
      <stop offset="0.55" stop-color="#8B5CF6" />
      <stop offset="1" stop-color="#22C55E" />
    </linearGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#1F2A44" stroke-width="1" opacity="0.55" />
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="26" fill="url(#bg)" />
  <rect width="1200" height="300" rx="26" fill="url(#grid)" opacity="0.35" />
  <rect width="1200" height="300" rx="26" fill="url(#glow)" />

  <!-- Log stream (subtle) -->
  <g opacity="0.28" stroke-linecap="round">
    <path d="M520 78H1120" stroke="#1F3556" stroke-width="10" />
    <path d="M520 110H1030" stroke="#1F3556" stroke-width="10" />
    <path d="M520 142H1090" stroke="#1F3556" stroke-width="10" />
    <path d="M520 174H980" stroke="#1F3556" stroke-width="10" />
    <path d="M520 206H1060" stroke="#1F3556" stroke-width="10" />
  </g>

  <!-- Icon -->
  <g transform="translate(98 150)" filter="url(#shadow)">
    <circle r="72" fill="url(#accent)" />
    <circle r="62" fill="#0B1220" opacity="0.88" />

    <g stroke="#E6EDF3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.98">
      <path d="M-18 -28L-44 0L-18 28" />
      <path d="M18 -28L44 0L18 28" />
      <path d="M0 -34L0 34" />
    </g>

    <circle cx="34" cy="40" r="6" fill="#22C55E" opacity="0.95" />
  </g>

  <!-- Wordmark -->
  <text x="205" y="142" class="title" fill="#E6EDF3" font-size="78" font-weight="800" letter-spacing="-1.2">agentlog</text>
  <text x="208" y="188" class="title" fill="#9AA4B2" font-size="22" font-weight="550">Unified Python API for agent session logs</text>

  <!-- Provider pills -->
  <g transform="translate(208 216)">
    <g transform="translate(0 0)">
      <rect width="158" height="34" rx="17" fill="#0F172A" stroke="#273451" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#00D1FF" />
      <text x="28" y="22" class="title" fill="#C7D0DA" font-size="14" font-weight="650">Claude Code</text>
    </g>
    <g transform="translate(172 0)">
      <rect width="142" height="34" rx="17" fill="#0F172A" stroke="#273451" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#8B5CF6" />
      <text x="28" y="22" class="title" fill="#C7D0DA" font-size="14" font-weight="650">Codex CLI</text>
    </g>
    <g transform="translate(328 0)">
      <rect width="150" height="34" rx="17" fill="#0F172A" stroke="#273451" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#F59E0B" />
      <text x="28" y="22" class="title" fill="#C7D0DA" font-size="14" font-weight="650">Gemini CLI</text>
    </g>
    <g transform="translate(492 0)">
      <rect width="112" height="34" rx="17" fill="#0F172A" stroke="#273451" stroke-width="1" />
      <circle cx="16" cy="17" r="5" fill="#22C55E" />
      <text x="28" y="22" class="title" fill="#C7D0DA" font-size="14" font-weight="650">Cursor</text>
    </g>
  </g>

  <!-- Footer hint -->
  <text x="1085" y="274" class="mono" fill="#6B7687" font-size="14" text-anchor="end">SessionRegistry · EventParser · SessionInfo · AgentEvent</text>
</svg>
