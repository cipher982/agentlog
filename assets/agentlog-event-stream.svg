<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="agentlog event stream diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220" />
      <stop offset="1" stop-color="#070A12" />
    </linearGradient>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#8FB3FF" />
    </marker>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <style>
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .card { fill: #0F172A; stroke: #2A385A; stroke-width: 1.2; }
      .muted { fill: #9AA4B2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="360" rx="22" fill="url(#bg)" />

  <text x="70" y="62" class="title" fill="#E6EDF3" font-size="22" font-weight="850">Normalized event stream</text>
  <text x="70" y="90" class="title muted" font-size="14" font-weight="600">Every provider maps onto a consistent <tspan class="mono">AgentEvent</tspan> shape.</text>

  <!-- Timeline -->
  <g opacity="0.35">
    <path d="M120 150H1080" stroke="#1F2A44" stroke-width="2" />
    <g fill="#1F2A44">
      <circle cx="240" cy="150" r="4" />
      <circle cx="480" cy="150" r="4" />
      <circle cx="720" cy="150" r="4" />
      <circle cx="960" cy="150" r="4" />
    </g>
  </g>

  <!-- Cards -->
  <g filter="url(#softShadow)">
    <g transform="translate(140 170)">
      <rect class="card" width="220" height="120" rx="16" />
      <rect x="18" y="18" width="10" height="84" rx="5" fill="#00D1FF" />
      <text x="40" y="44" class="mono" fill="#E6EDF3" font-size="15" font-weight="850">role: "user"</text>
      <text x="40" y="66" class="mono muted" font-size="13">event_type: "message"</text>
      <text x="40" y="92" class="mono muted" font-size="13">content_text: …</text>
      <text x="40" y="114" class="mono muted" font-size="13">raw_json: {...}</text>
    </g>

    <g transform="translate(380 170)">
      <rect class="card" width="220" height="120" rx="16" />
      <rect x="18" y="18" width="10" height="84" rx="5" fill="#8B5CF6" />
      <text x="40" y="44" class="mono" fill="#E6EDF3" font-size="15" font-weight="850">role: "assistant"</text>
      <text x="40" y="66" class="mono muted" font-size="13">event_type: "message"</text>
      <text x="40" y="92" class="mono muted" font-size="13">content_text: …</text>
      <text x="40" y="114" class="mono muted" font-size="13">raw_json: {...}</text>
    </g>

    <g transform="translate(620 170)">
      <rect class="card" width="220" height="120" rx="16" />
      <rect x="18" y="18" width="10" height="84" rx="5" fill="#F59E0B" />
      <text x="40" y="44" class="mono" fill="#E6EDF3" font-size="15" font-weight="850">event_type: "tool_call"</text>
      <text x="40" y="66" class="mono muted" font-size="13">tool_name: "…"</text>
      <text x="40" y="92" class="mono muted" font-size="13">tool_input_json: …</text>
      <text x="40" y="114" class="mono muted" font-size="13">raw_json: {...}</text>
    </g>

    <g transform="translate(860 170)">
      <rect class="card" width="220" height="120" rx="16" />
      <rect x="18" y="18" width="10" height="84" rx="5" fill="#22C55E" />
      <text x="40" y="44" class="mono" fill="#E6EDF3" font-size="15" font-weight="850">event_type: "tool_output"</text>
      <text x="40" y="66" class="mono muted" font-size="13">tool_output_text: …</text>
      <text x="40" y="92" class="mono muted" font-size="13">role: "user" | "assistant"</text>
      <text x="40" y="114" class="mono muted" font-size="13">raw_json: {...}</text>
    </g>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#8FB3FF" stroke-width="2.2" opacity="0.9" marker-end="url(#arrow)">
    <path d="M360 230H372" />
    <path d="M600 230H612" />
    <path d="M840 230H852" />
  </g>

  <text x="1130" y="332" class="mono muted" font-size="13" text-anchor="end">Filter by role, tool use, cwd, session_id, git metadata…</text>
</svg>
